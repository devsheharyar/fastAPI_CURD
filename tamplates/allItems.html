<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Items</title>
</head>
<body>
    <ul>
    {% for item in db_items %}
        <li>{{ item.name }} — {{ item.description }}</li>
    {% else %}
        <li>No items found.</li>
    {% endfor %}
</ul>
</body>
</html>
